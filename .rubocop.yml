require:
  - standard
  - standard-custom
  - standard-performance
  - rubocop-performance

inherit_gem:
  standard: config/base.yml
  standard-custom: config/base.yml
  standard-performance: config/base.yml

AllCops:
  TargetRubyVersion: 2.5
  Exclude:
    - appraisal/**/**
    - gemfiles/**/**
    - integration/**/**
    - lib/datadog/**/vendor/**/*
    - lib/datadog/profiling/ext/exec_monkey_patch.rb
    - vendor/bundle/**/*
  NewCops: disable
  SuggestExtensions: false

# The cops disabled below should stay in sync with .standard_todo.yml's
# "**/**" ignore list (Layout/LeadingCommentSpace has an extra reason
# there) so it stays clear which tool is, or is not, enforcing each cop.

# NOTE: `diff_comma` (comma only when the closing delimiter is on its own line)
# would be the preferred style here, matching TrailingCommaInArray/HashLiteral
# below. It is unavailable for TrailingCommaInArguments before RuboCop 1.81.0
# (rubocop/rubocop#10971); this repo is pinned to RuboCop 1.75.x transitively via
# standard ~> 1.49, so `comma` is the closest supported style. Tighten to
# `diff_comma` once RuboCop >= 1.81 is available.

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: diff_comma

Layout/LeadingCommentSpace:
  Enabled: false
